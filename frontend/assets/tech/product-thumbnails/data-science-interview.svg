  <text x="32" y="112" fill="#ffffff" font-family="-apple-system, Inter, sans-serif" font-size="22" font-weight="700">Interview</text>
  <text x="32" y="142" fill="#38bdf8" font-family="-apple-system, Inter, sans-serif" font-size="22" font-weight="700">Mastery Hack</text>
  <text x="32" y="172" fill="#94a3b8" font-family="-apple-system, Inter, sans-serif" font-size="12">Core stats · Modeling · Problem solving</text>
  <!-- Right decorative icon / chart -->
  <g transform="translate(270, 70)">
    <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" />
    <path d="M 20 65 Q 40 20 60 45 T 85 25" fill="none" stroke="#0055ff" stroke-width="3" stroke-linecap="round" />
    <circle cx="60" cy="45" r="4" fill="#38bdf8" />
